name: APK Android
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'src/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Dépendances
        run: cd mobile && npm ci --no-audit --no-fund
      - name: Compiler l'APK
        run: bash mobile/setup-android.sh 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with: { name: Nocte-APK, path: mobile/dist/Nocte.apk }
      - name: Publier APK et journal (branche apk-builds)
        if: always()
        run: |
          set -e
          mkdir -p /tmp/out && cp build.log /tmp/out/ 2>/dev/null || true
          [ -f mobile/dist/Nocte.apk ] && cp mobile/dist/Nocte.apk /tmp/out/ || true
          echo "$GITHUB_SHA $GITHUB_RUN_NUMBER" > /tmp/out/commit.txt
          cd /tmp/out && git init -q -b apk-builds && git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "APK build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk-builds
