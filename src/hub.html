<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'">
<title>Suite Bureautique Dark</title>
<link rel="stylesheet" href="vendor/fa/css/all.min.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="word-look.css">
<link rel="stylesheet" href="hub.css">
<link rel="stylesheet" href="common/motion.css">
</head>
<body class="look-word hub">
<aside class="hub-side">
  <div class="brand"><i class="fa-solid fa-table-cells-large"></i><div><b>Suite Bureautique</b><small>Dark Edition</small></div></div>
  <button class="hub-nav on"><i class="fa-solid fa-house"></i> Accueil</button>
  <button class="hub-nav" id="btn-open"><i class="fa-regular fa-folder-open"></i> Ouvrir un fichier…</button>
  <div class="grow"></div>
  <button class="hub-nav" id="btn-account"><i class="fa-brands fa-google"></i> <span id="acc-label">Se connecter avec Google</span></button>
  <button class="hub-nav" id="btn-look"><i class="fa-solid fa-circle-half-stroke"></i> Clair / sombre</button>
  <div class="hub-ver">Version 3.0</div>
</aside>
<main class="hub-main">
  <h1 id="hello">Bonjour</h1>
  <h2>Créer</h2>
  <div class="tiles">
    <button class="tile word" data-app="word"><i class="fa-solid fa-file-word"></i><b>Word</b><small>Document vierge</small></button>
    <button class="tile excel" data-app="excel"><i class="fa-solid fa-file-excel"></i><b>Excel</b><small>Classeur vierge</small></button>
    <button class="tile ppt" data-app="ppt"><i class="fa-solid fa-file-powerpoint"></i><b>PowerPoint</b><small>Présentation vierge</small></button>
  </div>
  <h2>Modèles</h2>
  <div class="tpls" id="tpls"></div>
  <h2>Documents récents <span class="muted">(enregistrés sur cet ordinateur)</span></h2>
  <div class="recent-box"><table><thead><tr><th>Nom</th><th>Application</th><th>Dernière modification</th></tr></thead><tbody id="recent"></tbody></table><div id="empty" class="empty">Aucun document pour le moment.</div></div>
</main>
<script src="common/lib.js"></script>
<script src="common/templates.js"></script>
<script src="hub.js"></script>
<script src="common/motion.js"></script>
</body>
</html>
